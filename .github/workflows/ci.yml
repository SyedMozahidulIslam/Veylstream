# NOT YET RUN on GitHub. The test commands below were run locally; ruff/mypy were not available locally.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check veylstream tests scripts
      - run: mypy veylstream --ignore-missing-imports
      - run: python -m unittest discover -s tests -v
      - run: node --check veylstream/web/app.js && node --check veylstream/web/pages.js
      - name: migration idempotence
        run: python -c "from veylstream.store import Store; import tempfile,os; p=os.path.join(tempfile.mkdtemp(),'a.db'); Store(p).close(); print(Store(p).schema_version())"
      - name: dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
