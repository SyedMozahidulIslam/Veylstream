[project]
name = "veylstream"
version = "0.1.0"
description = "Real-time intelligence and anomaly detection platform"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.4", "scikit-learn==1.8.0", "Flask==3.1.3", "Werkzeug==3.1.7"]

[project.scripts]
veylstream = "veylstream.__main__:main"

[tool.setuptools.package-data]
veylstream = ["web/*"]

[tool.ruff]
line-length = 180
target-version = "py312"
